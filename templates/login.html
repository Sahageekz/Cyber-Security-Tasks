<!DOCTYPE html>
<html>
<head>
    <title>Cybersecurity Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        .message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form method="POST">

            <label>Enter 3-Digit Password</label>

            <input
                type="password"
                name="password"
                maxlength="3"
                minlength="3"
                pattern="[0-9]{3}"
                placeholder="000"
                required
            >

            <button type="submit">Login</button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

    </div>

</body>
</html>
